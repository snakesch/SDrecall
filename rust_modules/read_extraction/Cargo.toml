[package]
name = "rust_read_extraction"
version = "0.1.0"
edition = "2021"
description = "Fast BAM to FASTQ conversion with region filtering for SDrecall"
license = "MIT"
authors = ["Xingtian Yang <yangyxt@hku.hk>"]
repository = "https://github.com/snakesch/SDrecall"

[lib]
name = "rust_read_extraction"
crate-type = ["cdylib"]

# Release profile is defined once at the workspace root (rust_modules/Cargo.toml).
# Cargo ignores [profile.*] in non-root members, so it is intentionally absent here.

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py38"] }
rust-htslib = "0.47"
rayon = "1.8"
thiserror = "1.0"
anyhow = "1.0"
flate2 = "1.0"

[lints]
workspace = true
