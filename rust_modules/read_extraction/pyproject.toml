[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "rust_read_extraction"
version = "0.1.0"
description = "Fast BAM to FASTQ conversion with region filtering for SDrecall"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Xingtian Yang", email = "yangyxt@hku.hk"}
]
keywords = ["bioinformatics", "bam", "fastq", "ngs", "genomics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/snakesch/SDrecall"
Repository = "https://github.com/snakesch/SDrecall"

[tool.maturin]
# Native extension module name for import
module-name = "rust_read_extraction"
# Use abi3 for broad Python compatibility
features = ["pyo3/abi3-py38"]
