[package]
name = "phasing"
version = "0.1.0"
edition = "2021"

# Release profile optimization is inherited from the workspace.

[lib]
name = "phasing"
path = "src/lib.rs"

[[bin]]
name = "phasing"
path = "src/main.rs"

[dependencies]
# Core numerics — pinned to the same ndarray the other crates use (T3 plan).
ndarray = "0.15"
log = "0.4"
rayon = { workspace = true }

# Binary (CLI / differential harness) I/O. Kept lib-free so a future T4 fuse can
# depend on the library without dragging these in (they can move behind a feature).
anyhow = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ndarray-npy = "0.8"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"

[lints]
workspace = true
