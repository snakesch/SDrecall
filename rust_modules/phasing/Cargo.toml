[package]
name = "phasing"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "phasing"
path = "src/main.rs"

[dependencies]
# BAM/SAM handling
rust-htslib = { workspace = true }

# Data structures
ahash = "0.8"
rustc-hash = "1.1"
petgraph = "0.6"

# Numerics
ndarray = { version = "0.15", features = ["blas"] }

# I/O & temp files
tempfile = "3.8"

# Logging & parallelism
log = "0.4"
rayon = { workspace = true }

# CLI
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
anyhow = { workspace = true }

# Shared types
sdrecall-utils = { path = "../sdrecall-utils" }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ndarray-npy = "0.8"

[lints]
workspace = true
