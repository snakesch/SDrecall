[package]
name = "haplotype_inspection"
version = "0.1.0"
edition = "2021"

# Note: Release profile optimization is set at workspace level.

[dependencies]
# BAM/SAM file handling
rust-htslib = "0.47.0"

# Interval tree for overlap queries (replaces Python NCLS)
rust-lapper = "1.1"

# Data structures
rustc-hash = "1.1"      # Fast HashMap for integer keys

# Numerical computing
ndarray = { version = "0.15", features = ["blas"] }

# Data processing and I/O
tempfile = "3.8"        # Temporary file handling

# Logging
log = "0.4"             # Logging framework

# ILP solver (BILC haplotype selection)
highs = "2.0"

[lints]
workspace = true

[dev-dependencies]
# Used only by unit tests and the example harnesses (reads RUST_LOG).
env_logger = "0.11"
