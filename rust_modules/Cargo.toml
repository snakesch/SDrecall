[workspace]
members = ["read_extraction", "haplotype_inspection", "phasing", "sdrecall-utils", "sdrecall-io", "nm-stats", "vcf-ops", "region-prep", "fp-control", "sd-prep", "sdrecall"]
resolver = "2"

# Optimize the production binaries and libraries for runtime performance.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace.dependencies]
rust-htslib = "0.47"
rayon = "1.8"
thiserror = "1.0"
anyhow = "1.0"

[workspace.lints.clippy]
all = "warn"
